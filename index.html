<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel Availability Tracker - Maputo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>Fuel Availability Tracker</h1>
      <p>Live community updates for petrol stations. Share the website link so everyone can check fuel status.</p>
      <div class="actions">
        <a class="btn btn-primary" href="https://docs.google.com/forms/d/e/1FAIpQLSfPMCxwpkkDNKVTun-te_qrqp7eGo6MW0YScHJi0MyGqFifhg/viewform" target="_blank" rel="noopener">Report a station</a>
        <button class="btn" id="refreshBtn">Refresh now</button>
      </div>
      <p class="muted small">Auto refresh every 2 minutes • Last refresh: <span id="lastRefresh">-</span></p>
    </div>
  </header>

  <main class="wrap">
    <section class="filters">
      <input type="text" id="searchInput" placeholder="Search station or area" />
      <select id="areaFilter">
        <option value="">All areas</option>
      </select>
      <select id="fuelFilter">
        <option value="">All fuel types</option>
        <option value="Petrol">Petrol</option>
        <option value="Diesel">Diesel</option>
      </select>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="Available">Available</option>
        <option value="Available with queue">Available with queue</option>
        <option value="Sold out">Sold out</option>
      </select>
    </section>

    <section id="summary" class="summary"></section>
    <section id="stations" class="cards"></section>
    <section id="emptyState" class="empty hidden">No stations match your filters yet.</section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxfBjo9WV2vMbT5LCDZkzT6WKkyGvZmoVSeIdaM5xaJ56jDSle2PDcseiutjyIaOrUBbw/exec";
    let allStations = [];

    function normalizeKey(value) {
      return String(value || "").trim().toLowerCase();
    }

    function friendlyDate(value) {
      if (!value) return "-";
      const d = new Date(value);
      return isNaN(d.getTime()) ? value : d.toLocaleString();
    }

    function statusClass(status) {
      const s = normalizeKey(status);
      if (s === "available") return "available";
      if (s === "available with queue") return "queue";
      if (s === "sold out") return "soldout";
      return "unknown";
    }

    function renderSummary(items) {
      const available = items.filter(x => normalizeKey(x.Status) === "available").length;
      const queue = items.filter(x => normalizeKey(x.Status) === "available with queue").length;
      const soldout = items.filter(x => normalizeKey(x.Status) === "sold out").length;

      document.getElementById("summary").innerHTML = `
        <div class="pill available">Available: <strong>${available}</strong></div>
        <div class="pill queue">Queue: <strong>${queue}</strong></div>
        <div class="pill soldout">Sold out: <strong>${soldout}</strong></div>
        <div class="pill">Total shown: <strong>${items.length}</strong></div>
      `;
    }

    function renderAreaOptions(items) {
      const select = document.getElementById("areaFilter");
      const current = select.value;
      const areas = [...new Set(items.map(x => String(x.Area || "").trim()).filter(Boolean))].sort();
      select.innerHTML = '<option value="">All areas</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join("");
      select.value = areas.includes(current) ? current : "";
    }

    function renderStations(items) {
      const container = document.getElementById("stations");
      const empty = document.getElementById("emptyState");

      if (!items.length) {
        container.innerHTML = "";
        empty.classList.remove("hidden");
        renderSummary(items);
        return;
      }

      empty.classList.add("hidden");
      container.innerHTML = items.map(item => `
        <article class="card ${statusClass(item.Status)}">
          <div class="card-top">
            <h3>${item.Station || "Unknown station"}</h3>
            <span class="badge">${item.Status || "Unknown"}</span>
          </div>
          <p><strong>Area:</strong> ${item.Area || "-"}</p>
          <p><strong>Fuel:</strong> ${item.FuelType || "-"}</p>
          <p><strong>Notes:</strong> ${item.Notes || "-"}</p>
          <p><strong>Reporter:</strong> ${item.Reporter || "Anonymous"}</p>
          <p class="small muted"><strong>Updated:</strong> ${friendlyDate(item.Timestamp)}</p>
        </article>
      `).join("");

      renderSummary(items);
    }

    function applyFilters() {
      const q = normalizeKey(document.getElementById("searchInput").value);
      const area = document.getElementById("areaFilter").value;
      const fuel = document.getElementById("fuelFilter").value;
      const status = document.getElementById("statusFilter").value;

      const filtered = allStations.filter(item => {
        const station = String(item.Station || "");
        const areaVal = String(item.Area || "");
        const matchesSearch = !q || station.toLowerCase().includes(q) || areaVal.toLowerCase().includes(q);
        const matchesArea = !area || areaVal === area;
        const matchesFuel = !fuel || String(item.FuelType || "") === fuel;
        const matchesStatus = !status || String(item.Status || "") === status;
        return matchesSearch && matchesArea && matchesFuel && matchesStatus;
      });

      renderStations(filtered);
    }

    async function loadStations() {
      const container = document.getElementById("stations");
      try {
        container.innerHTML = '<div class="loading">Loading stations...</div>';
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("Failed to fetch data");
        const data = await res.json();
        allStations = Array.isArray(data) ? data : [];
        renderAreaOptions(allStations);
        applyFilters();
        document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString();
      } catch (err) {
        container.innerHTML = `
          <div class="error">
            Could not load data yet.<br>
            Make sure you pasted your Apps Script web app URL into <code>index.html</code>.
          </div>
        `;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadStations);
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("areaFilter").addEventListener("change", applyFilters);
    document.getElementById("fuelFilter").addEventListener("change", applyFilters);
    document.getElementById("statusFilter").addEventListener("change", applyFilters);

    loadStations();
    setInterval(loadStations, 120000);
  </script>
</body>
</html>
