<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel Availability Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Fuel Availability Tracker</h1>
    <p>Community live updates for filling stations.</p>

    <div class="actions">
      <a class="btn btn-primary"
         href="https://docs.google.com/forms/d/e/1FAIpQLSe4umf6PGk1CxU6gd0x8rH4Y4gk9-F0fF6445jvb_zVv2th-w/viewform"
         target="_blank">Report a station</a>

      <button class="btn" id="refreshBtn">Refresh now</button>
    </div>

    <p class="muted small">
      Auto refresh every 2 minutes • Last refresh:
      <span id="lastRefresh">-</span>
    </p>
  </div>
</header>

<main class="wrap">

  <section class="filters">
    <input type="text" id="searchInput" placeholder="Search station, area or landmark" />
  </section>

  <section class="bubble-filters">
    <button class="filter-pill active" data-filter="all">All (0)</button>
    <button class="filter-pill" data-filter="petrol-available">Petrol Available (0)</button>
    <button class="filter-pill" data-filter="petrol-queue">Petrol Queue (0)</button>
    <button class="filter-pill" data-filter="petrol-soldout">Petrol Sold Out (0)</button>
    <button class="filter-pill" data-filter="diesel-available">Diesel Available (0)</button>
    <button class="filter-pill" data-filter="diesel-queue">Diesel Queue (0)</button>
    <button class="filter-pill" data-filter="diesel-soldout">Diesel Sold Out (0)</button>
  </section>

  <section id="stations" class="cards"></section>
  <section id="emptyState" class="empty hidden">No stations found.</section>

</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx8T7mxYF-lf6ukgoNHhxye-Nck4qHeQiEaDWDnMxgDEmuWQy4S8vqy8yH6jGu7feZyhA/exec";

let allStations = [];
let activeFilter = "all";

function normalize(value) {
  return String(value || "").toLowerCase().trim();
}

function friendlyDate(value) {
  const d = new Date(value);
  return isNaN(d) ? "-" : d.toLocaleString();
}

function statusClass(status) {
  const s = normalize(status);
  if (s === "available") return "available";
  if (s === "available with queue") return "queue";
  if (s === "sold out") return "soldout";
  return "unknown";
}

function matchesFilter(item, filter) {
  const p = normalize(item.PetrolStatus);
  const d = normalize(item.DieselStatus);

  switch (filter) {
    case "petrol-available": return p === "available";
    case "petrol-queue": return p === "available with queue";
    case "petrol-soldout": return p === "sold out";
    case "diesel-available": return d === "available";
    case "diesel-queue": return d === "available with queue";
    case "diesel-soldout": return d === "sold out";
    default: return true;
  }
}

function updateCounts(data) {
  const counts = {
    all: data.length,
    "petrol-available": data.filter(i => normalize(i.PetrolStatus) === "available").length,
    "petrol-queue": data.filter(i => normalize(i.PetrolStatus) === "available with queue").length,
    "petrol-soldout": data.filter(i => normalize(i.PetrolStatus) === "sold out").length,
    "diesel-available": data.filter(i => normalize(i.DieselStatus) === "available").length,
    "diesel-queue": data.filter(i => normalize(i.DieselStatus) === "available with queue").length,
    "diesel-soldout": data.filter(i => normalize(i.DieselStatus) === "sold out").length
  };

  const labels = {
    all: "All",
    "petrol-available": "Petrol Available",
    "petrol-queue": "Petrol Queue",
    "petrol-soldout": "Petrol Sold Out",
    "diesel-available": "Diesel Available",
    "diesel-queue": "Diesel Queue",
    "diesel-soldout": "Diesel Sold Out"
  };

  document.querySelectorAll(".filter-pill").forEach(btn => {
    const key = btn.dataset.filter;
    btn.textContent = `${labels[key]} (${counts[key] || 0})`;
  });
}

function render(data) {
  const container = document.getElementById("stations");
  const empty = document.getElementById("emptyState");

  if (!data.length) {
    container.innerHTML = "";
    empty.classList.remove("hidden");
    return;
  }

  empty.classList.add("hidden");

  container.innerHTML = data.map(item => `
    <div class="card">
      <div class="card-top">
        <h3>${item.Station}</h3>
        <span class="badge">${item.Area}</span>
      </div>

      <p><strong>Landmark:</strong> ${item.Landmark}</p>

      <div class="fuel-grid">
        <div class="fuel-box ${statusClass(item.PetrolStatus)}">
          <strong>Petrol</strong><br>${item.PetrolStatus}
        </div>
        <div class="fuel-box ${statusClass(item.DieselStatus)}">
          <strong>Diesel</strong><br>${item.DieselStatus}
        </div>
      </div>

      <p><strong>Notes:</strong> ${item.Notes || "-"}</p>
      <p><strong>Reporter:</strong> ${item.Reporter}</p>
      <p class="small muted"><strong>Updated:</strong> ${friendlyDate(item.Timestamp)}</p>
    </div>
  `).join("");
}

function applyFilters() {
  const q = normalize(document.getElementById("searchInput").value);

  const filtered = allStations.filter(item => {
    const textMatch =
      !q ||
      normalize(item.Station).includes(q) ||
      normalize(item.Area).includes(q) ||
      normalize(item.Landmark).includes(q);

    return textMatch && matchesFilter(item, activeFilter);
  });

  render(filtered);
}

async function load() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    allStations = data;

    updateCounts(data);
    applyFilters();

    document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString();
  } catch {
    document.getElementById("stations").innerHTML = "Error loading data";
  }
}

document.getElementById("refreshBtn").onclick = load;
document.getElementById("searchInput").oninput = applyFilters;

document.querySelectorAll(".filter-pill").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    applyFilters();
  };
});

load();
setInterval(load, 120000);
</script>

</body>
</html>
