<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel Availability Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Fuel Availability Tracker</h1>
    <p>Community live updates for filling stations.</p>

    <div class="actions">
      <a class="btn btn-primary"
         href="https://docs.google.com/forms/d/e/1FAIpQLSe4umf6PGk1CxU6gd0x8rH4Y4gk9-F0fF6445jvb_zVv2th-w/viewform"
         target="_blank">Report a station</a>

      <button class="btn" id="refreshBtn">Refresh now</button>
    </div>

    <!-- LANGUAGE SWITCH -->
    <div class="lang-switch">
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('pt')">PT</button>
    </div>

    <p class="muted small">
      Auto refresh every 2 minutes • Last refresh:
      <span id="lastRefresh">-</span>
    </p>
  </div>
</header>

<main class="wrap">

  <section class="filters">
    <input type="text" id="searchInput" placeholder="Search station or area">
  </section>

  <section class="bubbles">
    <button onclick="setFilter('all')">All</button>
    <button onclick="setFilter('petrol-available')">Petrol Available</button>
    <button onclick="setFilter('petrol-queue')">Petrol Queue</button>
    <button onclick="setFilter('petrol-soldout')">Petrol Sold Out</button>
    <button onclick="setFilter('diesel-available')">Diesel Available</button>
    <button onclick="setFilter('diesel-queue')">Diesel Queue</button>
    <button onclick="setFilter('diesel-soldout')">Diesel Sold Out</button>
  </section>

  <section id="stations" class="cards"></section>
  <section id="emptyState" class="empty hidden">No stations found.</section>

</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx8T7mxYF-lf6ukgoNHhxye-Nck4qHeQiEaDWDnMxgDEmuWQy4S8vqy8yH6jGu7feZyhA/exec";

let allStations = [];
let activeFilter = "all";
let currentLang = "en";

/* TRANSLATIONS */
const translations = {
  en: {
    title: "Fuel Availability Tracker",
    subtitle: "Community live updates for filling stations.",
    report: "Report a station",
    refresh: "Refresh now",
    search: "Search station or area",
    all: "All",
    petrolAvailable: "Petrol Available",
    petrolQueue: "Petrol Queue",
    petrolSold: "Petrol Sold Out",
    dieselAvailable: "Diesel Available",
    dieselQueue: "Diesel Queue",
    dieselSold: "Diesel Sold Out",
    landmark: "Landmark",
    notes: "Notes",
    reporter: "Reporter",
    updated: "Updated"
  },
  pt: {
    title: "Disponibilidade de Combustível",
    subtitle: "Atualizações da comunidade sobre postos de combustível.",
    report: "Reportar posto",
    refresh: "Atualizar",
    search: "Pesquisar posto ou área",
    all: "Todos",
    petrolAvailable: "Gasolina Disponível",
    petrolQueue: "Gasolina com fila",
    petrolSold: "Gasolina Esgotada",
    dieselAvailable: "Diesel Disponível",
    dieselQueue: "Diesel com fila",
    dieselSold: "Diesel Esgotado",
    landmark: "Referência",
    notes: "Notas",
    reporter: "Utilizador",
    updated: "Atualizado"
  }
};

function normalize(v) {
  return String(v || "").toLowerCase().trim();
}

function friendlyDate(v) {
  const d = new Date(v);
  return isNaN(d) ? "-" : d.toLocaleString();
}

function setLang(lang) {
  currentLang = lang;
  applyLanguage();
  applyFilters();
}

function applyLanguage() {
  const t = translations[currentLang];

  document.querySelector("h1").textContent = t.title;
  document.querySelector(".hero p").textContent = t.subtitle;
  document.querySelector(".btn-primary").textContent = t.report;
  document.getElementById("refreshBtn").textContent = t.refresh;
  document.getElementById("searchInput").placeholder = t.search;

  const buttons = document.querySelectorAll(".bubbles button");
  if (buttons.length >= 7) {
    buttons[0].textContent = t.all;
    buttons[1].textContent = t.petrolAvailable;
    buttons[2].textContent = t.petrolQueue;
    buttons[3].textContent = t.petrolSold;
    buttons[4].textContent = t.dieselAvailable;
    buttons[5].textContent = t.dieselQueue;
    buttons[6].textContent = t.dieselSold;
  }
}

function setFilter(filter) {
  activeFilter = filter;
  applyFilters();
}

function applyFilters() {
  const q = normalize(document.getElementById("searchInput").value);

  const filtered = allStations.filter(item => {
    const station = normalize(item.Station);
    const area = normalize(item.Area);
    const landmark = normalize(item.Landmark);

    const petrol = normalize(item.PetrolStatus);
    const diesel = normalize(item.DieselStatus);

    let match = true;

    switch (activeFilter) {
      case "petrol-available": match = petrol === "available"; break;
      case "petrol-queue": match = petrol === "available with queue"; break;
      case "petrol-soldout": match = petrol === "sold out"; break;
      case "diesel-available": match = diesel === "available"; break;
      case "diesel-queue": match = diesel === "available with queue"; break;
      case "diesel-soldout": match = diesel === "sold out"; break;
    }

    const searchMatch =
      !q ||
      station.includes(q) ||
      area.includes(q) ||
      landmark.includes(q);

    return match && searchMatch;
  });

  render(filtered);
}

function render(data) {
  const t = translations[currentLang];
  const container = document.getElementById("stations");
  const empty = document.getElementById("emptyState");

  if (!data.length) {
    container.innerHTML = "";
    empty.classList.remove("hidden");
    return;
  }

  empty.classList.add("hidden");

  container.innerHTML = data.map(item => `
    <div class="card">
      <div class="card-top">
        <h3>${item.Station}</h3>
        <span class="badge">${item.Area}</span>
      </div>

      <p><strong>${t.landmark}:</strong> ${item.Landmark}</p>

      <div class="fuel-grid">
        <div class="fuel-box ${normalize(item.PetrolStatus)}">
          <strong>Petrol</strong><br>${item.PetrolStatus}
        </div>
        <div class="fuel-box ${normalize(item.DieselStatus)}">
          <strong>Diesel</strong><br>${item.DieselStatus}
        </div>
      </div>

      <p><strong>${translations[currentLang].landmark}:</strong> ${item.Landmark}</p>
<p><strong>${translations[currentLang].notes}:</strong> ${item.Notes || "-"}</p>
<p><strong>${translations[currentLang].reporter}:</strong> ${item.Reporter}</p>
<p class="small muted"><strong>${translations[currentLang].updated}:</strong> ${friendlyDate(item.Timestamp)}</p>
    </div>
  `).join("");
}

async function load() {
  const res = await fetch(API_URL);
  const data = await res.json();
  allStations = data;
  applyFilters();
  document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString();
}

document.getElementById("refreshBtn").onclick = load;
document.getElementById("searchInput").oninput = applyFilters;

applyLanguage();
load();
setInterval(load, 120000);
</script>

</body>
</html>
