<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel Availability Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Fuel Availability Tracker</h1>
    <p>Community live updates for filling stations.</p>

    <div class="actions">
      <a class="btn btn-primary"
         href="https://docs.google.com/forms/d/e/1FAIpQLSe4umf6PGk1CxU6gd0x8rH4Y4gk9-F0fF6445jvb_zVv2th-w/viewform"
         target="_blank">Report a station</a>

      <button class="btn" id="refreshBtn">Refresh now</button>
    </div>

    <div class="lang-switch">
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('pt')">PT</button>
    </div>

    <p class="muted small">
      Auto refresh every 2 minutes • Last refresh:
      <span id="lastRefresh">-</span>
    </p>
  </div>
</header>

<main class="wrap">

  <section class="filters">
    <input type="text" id="searchInput" placeholder="Search station or area">
  </section>

  <section class="bubbles">
    <button onclick="setFilter('all')" id="bubble-all">All (0)</button>
    <button onclick="setFilter('petrol-available')" id="bubble-petrol-available">Petrol Available (0)</button>
    <button onclick="setFilter('petrol-queue')" id="bubble-petrol-queue">Petrol Queue (0)</button>
    <button onclick="setFilter('petrol-soldout')" id="bubble-petrol-soldout">Petrol Sold Out (0)</button>
    <button onclick="setFilter('diesel-available')" id="bubble-diesel-available">Diesel Available (0)</button>
    <button onclick="setFilter('diesel-queue')" id="bubble-diesel-queue">Diesel Queue (0)</button>
    <button onclick="setFilter('diesel-soldout')" id="bubble-diesel-soldout">Diesel Sold Out (0)</button>
  </section>

  <section id="stations" class="cards"></section>
  <section id="emptyState" class="empty hidden">No stations found.</section>

</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx8T7mxYF-lf6ukgoNHhxye-Nck4qHeQiEaDWDnMxgDEmuWQy4S8vqy8yH6jGu7feZyhA/exec";

let allStations = [];
let activeFilter = "all";
let currentLang = "en";

const translations = {
  en: {
    title: "Fuel Availability Tracker",
    subtitle: "Community live updates for filling stations.",
    report: "Report a station",
    refresh: "Refresh now",
    search: "Search station or area",
    all: "All",
    petrolAvailable: "Petrol Available",
    petrolQueue: "Petrol Queue",
    petrolSold: "Petrol Sold Out",
    dieselAvailable: "Diesel Available",
    dieselQueue: "Diesel Queue",
    dieselSold: "Diesel Sold Out",
    landmark: "Landmark",
    notes: "Notes",
    reporter: "Reporter",
    updated: "Updated",
    noStations: "No stations found."
  },
  pt: {
    title: "Disponibilidade de Combustível",
    subtitle: "Atualizações da comunidade sobre postos de combustível.",
    report: "Reportar posto",
    refresh: "Atualizar",
    search: "Pesquisar posto ou área",
    all: "Todos",
    petrolAvailable: "Gasolina Disponível",
    petrolQueue: "Gasolina com fila",
    petrolSold: "Gasolina Esgotada",
    dieselAvailable: "Diesel Disponível",
    dieselQueue: "Diesel com fila",
    dieselSold: "Diesel Esgotado",
    landmark: "Referência",
    notes: "Notas",
    reporter: "Utilizador",
    updated: "Atualizado",
    noStations: "Nenhum posto encontrado."
  }
};

function normalize(v) {
  return String(v || "").toLowerCase().trim();
}

function friendlyDate(v) {
  const d = new Date(v);
  return isNaN(d) ? "-" : d.toLocaleString();
}

function statusClass(status) {
  const s = normalize(status);
  if (s === "available") return "available";
  if (s === "available with queue") return "queue";
  if (s === "sold out") return "soldout";
  return "unknown";
}

function setLang(lang) {
  currentLang = lang;
  applyLanguage();
  updateBubbleCounts();
  applyFilters();
}

function applyLanguage() {
  const t = translations[currentLang];

  document.querySelector("h1").textContent = t.title;
  document.querySelector(".hero p").textContent = t.subtitle;
  document.querySelector(".btn-primary").textContent = t.report;
  document.getElementById("refreshBtn").textContent = t.refresh;
  document.getElementById("searchInput").placeholder = t.search;
  document.getElementById("emptyState").textContent = t.noStations;

  updateBubbleCounts();
}

function updateBubbleCounts() {
  const t = translations[currentLang];

  const counts = {
    all: allStations.length,
    petrolAvailable: allStations.filter(x => normalize(x.PetrolStatus) === "available").length,
    petrolQueue: allStations.filter(x => normalize(x.PetrolStatus) === "available with queue").length,
    petrolSold: allStations.filter(x => normalize(x.PetrolStatus) === "sold out").length,
    dieselAvailable: allStations.filter(x => normalize(x.DieselStatus) === "available").length,
    dieselQueue: allStations.filter(x => normalize(x.DieselStatus) === "available with queue").length,
    dieselSold: allStations.filter(x => normalize(x.DieselStatus) === "sold out").length
  };

  document.getElementById("bubble-all").textContent = `${t.all} (${counts.all})`;
  document.getElementById("bubble-petrol-available").textContent = `${t.petrolAvailable} (${counts.petrolAvailable})`;
  document.getElementById("bubble-petrol-queue").textContent = `${t.petrolQueue} (${counts.petrolQueue})`;
  document.getElementById("bubble-petrol-soldout").textContent = `${t.petrolSold} (${counts.petrolSold})`;
  document.getElementById("bubble-diesel-available").textContent = `${t.dieselAvailable} (${counts.dieselAvailable})`;
  document.getElementById("bubble-diesel-queue").textContent = `${t.dieselQueue} (${counts.dieselQueue})`;
  document.getElementById("bubble-diesel-soldout").textContent = `${t.dieselSold} (${counts.dieselSold})`;
}

function setFilter(filter) {
  activeFilter = filter;
  applyFilters();
}

function applyFilters() {
  const q = normalize(document.getElementById("searchInput").value);

  const filtered = allStations.filter(item => {
    const station = normalize(item.Station);
    const area = normalize(item.Area);
    const landmark = normalize(item.Landmark);

    const petrol = normalize(item.PetrolStatus);
    const diesel = normalize(item.DieselStatus);

    let match = true;

    switch (activeFilter) {
      case "petrol-available": match = petrol === "available"; break;
      case "petrol-queue": match = petrol === "available with queue"; break;
      case "petrol-soldout": match = petrol === "sold out"; break;
      case "diesel-available": match = diesel === "available"; break;
      case "diesel-queue": match = diesel === "available with queue"; break;
      case "diesel-soldout": match = diesel === "sold out"; break;
    }

    const searchMatch =
      !q ||
      station.includes(q) ||
      area.includes(q) ||
      landmark.includes(q);

    return match && searchMatch;
  });

  render(filtered);
}

function render(data) {
  const t = translations[currentLang];
  const container = document.getElementById("stations");
  const empty = document.getElementById("emptyState");

  if (!data.length) {
    container.innerHTML = "";
    empty.classList.remove("hidden");
    return;
  }

  empty.classList.add("hidden");

  container.innerHTML = data.map(item => `
    <div class="card">
      <div class="card-top">
        <h3>${item.Station || "-"}</h3>
        <span class="badge">${item.Area || "-"}</span>
      </div>

      <p><strong>${t.landmark}:</strong> ${item.Landmark || "-"}</p>

      <div class="fuel-grid">
        <div class="fuel-box ${statusClass(item.PetrolStatus)}">
          <strong>Petrol</strong><br>${item.PetrolStatus || "Unknown"}
        </div>
        <div class="fuel-box ${statusClass(item.DieselStatus)}">
          <strong>Diesel</strong><br>${item.DieselStatus || "Unknown"}
        </div>
      </div>

      <p><strong>${t.notes}:</strong> ${item.Notes || "-"}</p>
      <p><strong>${t.reporter}:</strong> ${item.Reporter || "-"}</p>
      <p class="small muted"><strong>${t.updated}:</strong> ${friendlyDate(item.Timestamp)}</p>
    </div>
  `).join("");
}

async function load() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    allStations = Array.isArray(data) ? data : [];
    updateBubbleCounts();
    applyFilters();
    document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("stations").innerHTML = "<div class='error'>Error loading data</div>";
  }
}

document.getElementById("refreshBtn").onclick = load;
document.getElementById("searchInput").oninput = applyFilters;

applyLanguage();
load();
setInterval(load, 120000);
</script>

</body>
</html>
